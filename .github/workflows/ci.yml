name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
      - run: npm run packcheck
      - name: Package source and installable bundle
        if: matrix.node == 24
        run: |
          mkdir -p /tmp/dsh-playbook-artifacts
          git archive HEAD -o /tmp/dsh-playbook-artifacts/source.tar
          npm pack --pack-destination /tmp/dsh-playbook-artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: dsh-playbook-source-and-package
          path: /tmp/dsh-playbook-artifacts
          retention-days: 14
  sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm ls @deepseek-ai/dsh-tools @deepseek-ai/dsh-llm
      - run: npm run sdkcheck

  media-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test-only decoders
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 --version && ffmpeg -version && ffprobe -version
      - run: npm run mediatest
      - run: node scripts/isolation-smoke.mjs
      - run: node scripts/delivery-smoke.mjs

  client-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated DOM test dependencies (not runtime dependencies)
        run: npm install --ignore-scripts --no-package-lock --no-save react@18.3.1 react-dom@18.3.1 jsdom@24.1.3
      - run: node scripts/client-review-smoke.mjs

  revision-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check out a coherent Host runtime (published commands peer is from an older release family)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ddefc45fbc7f8e46dd73185e68295696d1297887
          path: .harness-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install pinned-source test fixture without lifecycle scripts
        working-directory: .harness-runtime
        run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Link test-only runner dependencies
        run: ln -s "$PWD/.harness-runtime/node_modules" node_modules
      - name: Actual Host command/revision driver with a scripted model
        env:
          TSX_TSCONFIG_PATH: ${{ github.workspace }}/.harness-runtime/tsconfig.json
        run: node --import tsx scripts/revision-driver-smoke.mjs
      - name: Actual Host clarification and pre-start loop control with a scripted model
        env:
          TSX_TSCONFIG_PATH: ${{ github.workspace }}/.harness-runtime/tsconfig.json
        run: node --import tsx scripts/intake-driver-smoke.mjs
